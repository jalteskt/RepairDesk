<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register Shop — RepairDesk</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/navbar.css">
  <link rel="stylesheet" href="../css/footer.css">
  <style>
    .auth-page {
      min-height: calc(100vh - 160px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 20px;
      background: linear-gradient(135deg, #f8fafc 0%, #f0fdfa 100%);
    }
    .auth-card {
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.08);
      width: 100%;
      max-width: 500px;
      padding: 40px;
    }
    .auth-header {
      text-align: center;
      margin-bottom: 28px;
    }
    .auth-logo {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 52px;
      height: 52px;
      background: var(--primary);
      color: #fff;
      border-radius: 14px;
      margin-bottom: 16px;
    }
    .auth-logo svg {
      width: 28px;
      height: 28px;
    }
    .auth-title {
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 8px;
    }
    .auth-subtitle {
      font-size: 0.95rem;
      color: var(--text-light);
    }
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    @media (max-width: 540px) {
      .form-row {
        grid-template-columns: 1fr;
      }
    }
    .form-group {
      margin-bottom: 16px;
    }
    .form-label {
      display: block;
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 6px;
    }
    .form-control {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      font-size: 0.95rem;
      font-family: inherit;
    }
    .form-control:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(13, 148, 136, 0.15);
    }
    .terms-label {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      font-size: 0.85rem;
      color: var(--text-light);
      margin-bottom: 24px;
      line-height: 1.4;
      cursor: pointer;
    }
    .terms-label input {
      margin-top: 3px;
    }
    .terms-label a {
      color: var(--primary);
      text-decoration: none;
    }
    .btn-submit {
      width: 100%;
      padding: 12px;
      font-size: 1rem;
      font-weight: 600;
    }
    .auth-footer {
      text-align: center;
      margin-top: 24px;
      font-size: 0.9rem;
      color: var(--text-light);
    }
    .auth-footer a {
      color: var(--primary);
      font-weight: 600;
      text-decoration: none;
    }
  </style>
</head>
<body>

  <!-- Navigation Bar -->
  <header class="navbar">
    <div class="navbar-container">
      <a href="../index.html" class="navbar-brand">
        <span class="navbar-logo-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
          </svg>
        </span>
        <span class="navbar-brand-name">RepairDesk</span>
      </a>

      <nav class="navbar-nav">
        <ul class="navbar-links">
          <li><a href="../index.html">Home</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="help.html">Help Center</a></li>
          <li><a href="pricing.html">Pricing</a></li>
          <li><a href="track.html">Track Repair</a></li>
        </ul>
      </nav>

      <div class="navbar-actions">
        <a href="login.html" class="btn btn-outline btn-sm">Log In</a>
      </div>
    </div>
  </header>

  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-logo">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
          </svg>
        </div>
        <h1 class="auth-title">Create your workspace</h1>
        <p class="auth-subtitle">14 days free trial. No credit card required.</p>
      </div>

      <form id="signup-form" onsubmit="handleSignup(event)">
        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="first-name">First Name</label>
            <input type="text" id="first-name" class="form-control" placeholder="Elena" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="last-name">Last Name</label>
            <input type="text" id="last-name" class="form-control" placeholder="Corpuz" required>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="shop-name">Repair Business / Shop Name</label>
          <input type="text" id="shop-name" class="form-control" placeholder="Metro Manila Electronics Repair Desk" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="email">Work Email</label>
          <input type="email" id="email" class="form-control" placeholder="elena@metrorepair.ph" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Create Password</label>
          <input type="password" id="password" class="form-control" placeholder="Min. 8 characters" minlength="8" required>
        </div>

        <label class="terms-label">
          <input type="checkbox" required checked>
          <span>I agree to the <a href="#">Terms of Service</a>, data storage consent policy, and the standard 30-day unclaimed item policy.</span>
        </label>

        <button type="submit" class="btn btn-primary btn-submit">Create Shop Account</button>
      </form>

      <div class="auth-footer">
        Already registered? <a href="login.html">Sign In</a>
      </div>
    </div>
  </div>

  <script>
    function handleSignup(e) {
      e.preventDefault();
      const shopName = document.getElementById('shop-name').value;
      const firstName = document.getElementById('first-name').value;
      localStorage.setItem('repairdesk_shop', shopName);
      localStorage.setItem('repairdesk_user', `${firstName} (Owner / Admin)`);
      localStorage.setItem('repairdesk_role', 'admin');
      window.location.href = '../dashboard/index.html';
    }
  </script>
</body>
</html>
