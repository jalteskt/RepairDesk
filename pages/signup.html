<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register Shop â€” RepairDesk</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/navbar.css">
  <link rel="stylesheet" href="../css/footer.css">
  <style>
    .auth-page {
      min-height: calc(100vh - 160px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 20px;
      background: linear-gradient(135deg, var(--bg) 0%, var(--primary-50) 100%);
    }
    .auth-card {
      background: light-dark(#ffffff, #202b36);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.08);
      width: 100%;
      max-width: 500px;
      padding: 40px;
    }
    .auth-header {
      text-align: center;
      margin-bottom: 28px;
    }
    .auth-title {
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 8px;
    }
    .auth-subtitle {
      font-size: 0.95rem;
      color: var(--text-light);
    }
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    @media (max-width: 540px) {
      .form-row {
        grid-template-columns: 1fr;
      }
    }
    .form-group {
      margin-bottom: 16px;
    }
    .form-label {
      display: block;
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 6px;
    }
    .form-control {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      font-size: 0.95rem;
      font-family: inherit;
    }
    .form-control:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(22, 101, 52, 0.16);
    }
    .terms-label {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      font-size: 0.85rem;
      color: var(--text-light);
      margin-bottom: 24px;
      line-height: 1.4;
      cursor: pointer;
    }
    .terms-label input {
      margin-top: 3px;
    }
    .terms-label a {
      color: light-dark(var(--primary), #90dfac);
      text-decoration: none;
    }
    .btn-submit {
      width: 100%;
      padding: 12px;
      font-size: 1rem;
      font-weight: 600;
    }
    .auth-footer {
      text-align: center;
      margin-top: 24px;
      font-size: 0.9rem;
      color: var(--text-light);
    }
    .auth-footer a {
      color: light-dark(var(--primary), #90dfac);
      font-weight: 600;
      text-decoration: none;
    }
  </style>
  <link rel="stylesheet" href="../css/interactions.css">
  <script src="../js/dialogs.js"></script>
  <link rel="stylesheet" href="../css/theme.css">
  <script src="../js/theme.js"></script>
  <link rel="icon" type="image/svg+xml" href="../assets/logo.svg">
</head>
<body>

  <nav class="navbar" id="navbar">
    <div class="container">
      <a href="../index.html" class="navbar-logo"><img class="site-wordmark" src="../assets/logo.svg" alt="RepairDesk" width="156" height="26"></a>
      <div class="navbar-links">
        <a href="../index.html">Track Repair</a>
        <a href="about.html">About</a>
        <a href="help.html">Help Center</a>
        <a href="../index.html#need-a-repair">Need a Repair?</a>
      </div>
      <button class="navbar-hamburger" aria-label="Toggle menu">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
  </nav>
  <div class="navbar-mobile" id="navbar-mobile">
    <a href="../index.html">Track Repair</a>
    <a href="about.html">About</a>
    <a href="help.html">Help Center</a>
    <a href="../index.html#need-a-repair">Need a Repair?</a>
  </div>

  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-header">
        <img class="site-wordmark wordmark-panel signup-wordmark" src="../assets/logo.svg" alt="RepairDesk" width="156" height="26">
        <h1 class="auth-title">Staff accounts</h1>
        <p class="auth-subtitle">Accounts are managed by the shop administrator.</p>
      </div>

      <form id="signup-form" onsubmit="handleSignup(event)">
        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="first-name">First Name</label>
            <input type="text" id="first-name" class="form-control" placeholder="Elena" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="last-name">Last Name</label>
            <input type="text" id="last-name" class="form-control" placeholder="Corpuz" required>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="shop-name">Repair Business / Shop Name</label>
          <input type="text" id="shop-name" class="form-control" placeholder="Metro Manila Electronics Repair Desk" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="email">Work Email</label>
          <input type="email" id="email" class="form-control" placeholder="elena@metrorepair.ph" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Create Password</label>
          <input type="password" id="password" class="form-control" placeholder="Min. 8 characters" minlength="8" required>
        </div>

        <label class="terms-label">
          <input type="checkbox" required checked>
          <span>I agree to the <a href="#">Terms of Service</a>, data storage consent policy, and the standard 30-day unclaimed item policy.</span>
        </label>

        <button type="submit" class="btn btn-primary btn-submit">Contact administrator</button>
      </form>

      <div class="auth-footer">
        Already registered? <a href="login.html">Sign In</a>
      </div>
    </div>
  </div>

  <script src="../js/main.js"></script>
  <script>
    function handleSignup(e) { e.preventDefault(); RDUI.notice('This is a single-shop installation. Ask the shop administrator to create your staff account.'); }
  </script>
</body>
</html>
