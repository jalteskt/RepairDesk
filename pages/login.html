<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Staff Sign In — RepairDesk</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/navbar.css">
  <link rel="stylesheet" href="../css/footer.css">
  <style>
    .auth-page {
      min-height: calc(100vh - 64px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 20px;
      background: linear-gradient(135deg, var(--bg) 0%, var(--primary-50) 100%);
    }

    .auth-card {
      background: light-dark(#ffffff, #202b36);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
      width: 100%;
      max-width: 420px;
      padding: 40px;
    }

    .auth-header {
      text-align: center;
      margin-bottom: 28px;
    }



    .auth-title {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 6px;
    }

    .auth-subtitle {
      font-size: 0.9rem;
      color: var(--text-light);
    }





    .form-group {
      margin-bottom: 18px;
    }

    .form-label {
      display: block;
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 6px;
    }

    .form-control {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-size: 0.9375rem;
      font-family: inherit;
      background: light-dark(#fff, #202b36);
      color: var(--text);
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .form-control:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(22, 101, 52, 0.16);
    }

    .auth-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      font-size: 0.85rem;
    }

    .remember-me {
      display: flex;
      align-items: center;
      gap: 7px;
      cursor: pointer;
      color: var(--text);
    }



    .btn-submit {
      width: 100%;
      padding: 12px;
      font-size: 0.9375rem;
      font-weight: 600;
    }

    @media (max-width: 480px) {
      .auth-card {
        padding: 28px 20px;
        border-radius: var(--radius-lg);
      }

      .auth-title {
        font-size: 1.3rem;
      }

      .auth-page {
        padding: 24px 14px;
        align-items: flex-start;
        padding-top: 32px;
      }
    }
  </style>
  <link rel="stylesheet" href="../css/interactions.css">
  <script src="../js/dialogs.js"></script>
  <link rel="stylesheet" href="../css/theme.css">
  <script src="../js/theme.js"></script>
  <link rel="icon" type="image/svg+xml" href="../assets/logo.svg">
</head>
<body>
  <main class="rd-login"><a href="../index.html" class="rd-brand" aria-label="RepairDesk home"><img class="site-wordmark" src="../assets/logo.svg" alt="RepairDesk" width="156" height="26"></a>
    <div class="auth-card">
      <div class="auth-header">
        <h1 class="auth-title">Staff Sign In</h1>
      </div>

      <form id="login-form" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label class="form-label" for="email">Work Email Address</label>
          <input type="email" id="email" class="form-control" placeholder="name@repairdesk.ph" required value="">
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input type="password" id="password" class="form-control" placeholder="••••••••" required value="">
        </div>

        <div class="auth-row">
          <label class="remember-me"><input id="save-login" type="checkbox"> Save login</label>
        </div>

        <button type="submit" class="btn btn-primary btn-submit">Sign In to Workbench</button>
        <button type="button" class="text-action" id="forgot-password">Forgot password?</button>
      </form>
      <form id="recovery-form" hidden>
        <div class="form-group">
          <label class="form-label" for="recovery-email">Staff email address</label>
          <input class="form-control" id="recovery-email" name="email" type="email" autocomplete="email" required>
        </div>
        <fieldset id="reset-details" hidden disabled>
          <div class="form-group">
            <label class="form-label" for="reset-code">Six-digit email code</label>
            <input class="form-control" id="reset-code" name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="new-password">New password (at least 8 characters)</label>
            <input class="form-control" id="new-password" name="newPassword" type="password" autocomplete="new-password" minlength="8" maxlength="72" required>
          </div>
        </fieldset>
        <p id="recovery-status" role="status"></p>
        <button type="submit" class="btn btn-primary btn-submit">Email reset code</button>
        <button type="button" id="back-to-login" class="text-action">Back to sign in</button>
      </form>
    </div>
  </main>

  <script src="../js/main.js"></script>
  <script src="../js/api.js"></script>
  <script>
    async function handleLogin(e) {e.preventDefault();await RD.session();await RD.call('login',{email:document.getElementById('email').value,password:document.getElementById('password').value,remember:document.getElementById('save-login').checked});location.href='../dashboard/index.html';}
    document.addEventListener('DOMContentLoaded',async()=>{await RD.session();if (RD.user) location.replace('../dashboard/index.html');});
  </script>
<script src="../js/staff-recovery.js"></script>
</body>
</html>
