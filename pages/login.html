<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — RepairDesk</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/navbar.css">
  <link rel="stylesheet" href="../css/footer.css">
  <style>
    .auth-page {
      min-height: calc(100vh - 160px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 20px;
      background: linear-gradient(135deg, #f8fafc 0%, #f0fdfa 100%);
    }
    .auth-card {
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
      width: 100%;
      max-width: 440px;
      padding: 40px;
    }
    .auth-header {
      text-align: center;
      margin-bottom: 28px;
    }
    .auth-logo {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 52px;
      height: 52px;
      background: var(--primary);
      color: #fff;
      border-radius: 14px;
      margin-bottom: 16px;
    }
    .auth-logo svg {
      width: 28px;
      height: 28px;
    }
    .auth-title {
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 8px;
    }
    .auth-subtitle {
      font-size: 0.95rem;
      color: var(--text-light);
    }
    .demo-credentials-banner {
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      border-radius: var(--radius-md);
      padding: 12px 14px;
      margin-bottom: 24px;
      font-size: 0.85rem;
      color: #166534;
    }
    .demo-btn-group {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }
    .demo-chip {
      padding: 4px 10px;
      background: #dcfce7;
      border: 1px solid #86efac;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      color: #14532d;
      transition: background 0.2s;
    }
    .demo-chip:hover {
      background: #bbf7d0;
    }
    .form-group {
      margin-bottom: 18px;
    }
    .form-label {
      display: block;
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 6px;
    }
    .form-control {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      font-size: 0.95rem;
      font-family: inherit;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .form-control:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(13, 148, 136, 0.15);
    }
    .auth-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      font-size: 0.875rem;
    }
    .remember-me {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      color: var(--text);
    }
    .forgot-link {
      color: var(--primary);
      font-weight: 500;
      text-decoration: none;
    }
    .forgot-link:hover {
      text-decoration: underline;
    }
    .btn-submit {
      width: 100%;
      padding: 12px;
      font-size: 1rem;
      font-weight: 600;
    }
    .auth-footer {
      text-align: center;
      margin-top: 24px;
      font-size: 0.9rem;
      color: var(--text-light);
    }
    .auth-footer a {
      color: var(--primary);
      font-weight: 600;
      text-decoration: none;
    }
    .auth-footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <!-- Navigation Bar -->
  <header class="navbar">
    <div class="navbar-container">
      <a href="../index.html" class="navbar-brand">
        <span class="navbar-logo-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
          </svg>
        </span>
        <span class="navbar-brand-name">RepairDesk</span>
      </a>

      <nav class="navbar-nav">
        <ul class="navbar-links">
          <li><a href="../index.html">Home</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="help.html">Help Center</a></li>
          <li><a href="pricing.html">Pricing</a></li>
          <li><a href="track.html">Track Repair</a></li>
        </ul>
      </nav>

      <div class="navbar-actions">
        <a href="signup.html" class="btn btn-primary btn-sm">Create Account</a>
      </div>
    </div>
  </header>

  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-logo">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
          </svg>
        </div>
        <h1 class="auth-title">Welcome back</h1>
        <p class="auth-subtitle">Sign in to your repair workspace</p>
      </div>

      <!-- Quick Demo Access Banner -->
      <div class="demo-credentials-banner">
        <strong>Quick Demo Access:</strong> Click to fill role credentials:
        <div class="demo-btn-group">
          <button type="button" class="demo-chip" onclick="fillDemo('admin')">👑 Admin Role (Elena)</button>
          <button type="button" class="demo-chip" onclick="fillDemo('tech')">🔧 Danilo (Technician)</button>
        </div>
      </div>

      <form id="login-form" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label class="form-label" for="email">Work Email Address</label>
          <input type="email" id="email" class="form-control" placeholder="name@repairdesk.ph" required value="admin@repairdesk.ph">
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input type="password" id="password" class="form-control" placeholder="••••••••" required value="password123">
        </div>

        <div class="auth-row">
          <label class="remember-me">
            <input type="checkbox" checked>
            <span>Remember for 30 days</span>
          </label>
          <a href="#" class="forgot-link">Forgot password?</a>
        </div>

        <button type="submit" class="btn btn-primary btn-submit">Sign In to Dashboard</button>
      </form>

      <div class="auth-footer">
        Don't have a shop account? <a href="signup.html">Register workshop</a>
        <br>
        <span style="display:inline-block; margin-top:8px;">Are you a customer? <a href="track.html">Check repair status</a></span>
      </div>
    </div>
  </div>

  <script>
    function fillDemo(role) {
      const email = document.getElementById('email');
      const pass = document.getElementById('password');
      if (role === 'admin') {
        email.value = 'admin@repairdesk.ph';
        pass.value = 'admin2026!';
        localStorage.setItem('repairdesk_role', 'admin');
        localStorage.setItem('repairdesk_user', 'Elena Corpuz (Shop Admin)');
      } else {
        email.value = 'dan.mendoza@repairdesk.ph';
        pass.value = 'tech2026!';
        localStorage.setItem('repairdesk_role', 'technician');
        localStorage.setItem('repairdesk_user', 'Danilo "Dan" Mendoza (Technician)');
      }
    }

    function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      if (!localStorage.getItem('repairdesk_role')) {
        if (email.includes('admin')) {
          localStorage.setItem('repairdesk_role', 'admin');
          localStorage.setItem('repairdesk_user', 'Elena Corpuz (Shop Admin)');
        } else {
          localStorage.setItem('repairdesk_role', 'technician');
          localStorage.setItem('repairdesk_user', 'Danilo "Dan" Mendoza (Technician)');
        }
      }
      window.location.href = '../dashboard/index.html';
    }
  </script>
</body>
</html>
