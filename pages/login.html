<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Staff Sign In — RepairDesk</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/navbar.css">
  <link rel="stylesheet" href="../css/footer.css">
  <style>
    .auth-page {
      min-height: calc(100vh - 64px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 20px;
      background: linear-gradient(135deg, var(--bg) 0%, var(--primary-50) 100%);
    }

    .auth-card {
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
      width: 100%;
      max-width: 420px;
      padding: 40px;
    }

    .auth-header {
      text-align: center;
      margin-bottom: 28px;
    }

    .auth-logo {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 52px;
      height: 52px;
      background: var(--primary);
      color: #fff;
      border-radius: 14px;
      margin-bottom: 16px;
    }

    .auth-logo svg {
      width: 28px;
      height: 28px;
    }

    .auth-title {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 6px;
    }

    .auth-subtitle {
      font-size: 0.9rem;
      color: var(--text-light);
    }

    .demo-banner {
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      border-radius: var(--radius);
      padding: 12px 14px;
      margin-bottom: 24px;
      font-size: 0.825rem;
      color: #166534;
    }

    .demo-chips {
      display: flex;
      gap: 8px;
      margin-top: 8px;
      flex-wrap: wrap;
    }

    .demo-chip {
      padding: 4px 12px;
      background: #dcfce7;
      border: 1px solid #86efac;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      color: #14532d;
      transition: background 0.15s;
      white-space: nowrap;
    }

    .demo-chip:hover {
      background: #bbf7d0;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-label {
      display: block;
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 6px;
    }

    .form-control {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-size: 0.9375rem;
      font-family: inherit;
      background: #fff;
      color: var(--text);
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .form-control:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(22, 101, 52, 0.16);
    }

    .auth-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      font-size: 0.85rem;
    }

    .remember-me {
      display: flex;
      align-items: center;
      gap: 7px;
      cursor: pointer;
      color: var(--text);
    }

    .forgot-link {
      color: var(--primary);
      font-weight: 500;
    }

    .forgot-link:hover {
      text-decoration: underline;
    }

    .btn-submit {
      width: 100%;
      padding: 12px;
      font-size: 0.9375rem;
      font-weight: 600;
    }

    @media (max-width: 480px) {
      .auth-card {
        padding: 28px 20px;
        border-radius: var(--radius-lg);
      }

      .auth-title {
        font-size: 1.3rem;
      }

      .auth-page {
        padding: 24px 14px;
        align-items: flex-start;
        padding-top: 32px;
      }
    }
  </style>
</head>
<body>

  <!-- ========== NAVBAR ========== -->
  <nav class="navbar" id="navbar">
    <div class="container">
      <a href="../index.html" class="navbar-logo">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
        </svg>
        Repair<span>Desk</span>
      </a>
      <div class="navbar-links">
        <a href="../index.html">Track Repair</a>
        <a href="about.html">About</a>
        <a href="help.html">Help Center</a>
        <a href="../index.html#need-a-repair">Need a Repair?</a>
      </div>
      <button class="navbar-hamburger" aria-label="Toggle menu">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
  </nav>
  <div class="navbar-mobile" id="navbar-mobile">
    <a href="../index.html">Track Repair</a>
    <a href="about.html">About</a>
    <a href="help.html">Help Center</a>
    <a href="../index.html#need-a-repair">Need a Repair?</a>
  </div>

  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-logo">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
          </svg>
        </div>
        <h1 class="auth-title">Staff Sign In</h1>
        <p class="auth-subtitle">RepairDesk Workshop Management System</p>
      </div>

      <!-- Demo Access Banner -->
      <div class="demo-banner">
        <strong>Demo Access:</strong> Sample password: <strong>Pass123!</strong><br>Admin: admin@repairdesk.net<br>Technician: tech@repairdesk.net
        <div class="demo-chips">
          <button type="button" class="demo-chip" onclick="fillDemo('admin')">👑 Admin (Elena)</button>
          <button type="button" class="demo-chip" onclick="fillDemo('tech')">🔧 Technician (Danilo)</button>
        </div>
      </div>

      <form id="login-form" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label class="form-label" for="email">Work Email Address</label>
          <input type="email" id="email" class="form-control" placeholder="name@repairdesk.ph" required value="">
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input type="password" id="password" class="form-control" placeholder="••••••••" required value="">
        </div>

        <div class="auth-row">
          <label class="remember-me">
            <input type="checkbox" disabled>
            <span>Session expires after 1 hour idle</span>
          </label>
          <a href="#" onclick="alert('Contact the shop administrator to reset access.'); return false;" class="forgot-link">Forgot password?</a>
        </div>

        <button type="submit" class="btn btn-primary btn-submit">Sign In to Workbench</button>
      </form>
    </div>
  </div>

  <script src="../js/main.js"></script>
  <script src="../js/api.js"></script>
  <script>
    function fillDemo(role) { document.getElementById('email').value=role==='admin'?'admin@repairdesk.net':'tech@repairdesk.net';document.getElementById('password').value='Pass123!'; }
    async function handleLogin(e) {e.preventDefault();await RD.session();await RD.call('login',{email:document.getElementById('email').value,password:document.getElementById('password').value});location.href='../dashboard/index.html';}
    document.addEventListener('DOMContentLoaded',async()=>{await RD.session();document.querySelector('.demo-banner').hidden=!RD.demo;});
  </script>
</body>
</html>
