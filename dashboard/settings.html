<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Workshop Settings — RepairDesk</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <style>
    .settings-grid {
      display: grid;
      grid-template-columns: 260px minmax(0, 1fr);
      gap: 36px;
      align-items: start;
    }
    @media (max-width: 900px) {
      .settings-grid { grid-template-columns: 1fr; }
    }

    .settings-nav {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .settings-nav-btn {
      display: block;
      width: 100%;
      text-align: left;
      padding: 10px 14px;
      border-radius: var(--radius);
      background: none;
      border: none;
      font-family: inherit;
      font-size: 13.5px;
      font-weight: 600;
      color: var(--text-light);
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .settings-nav-btn:hover {
      background: var(--bg-alt);
      color: var(--text);
    }
    .settings-nav-btn.active {
      background: var(--primary-50);
      color: light-dark(var(--primary), #90dfac);
    }

    .settings-actions {
      display: flex;
      gap: 10px;
      flex-shrink: 0;
    }

    .settings-cards-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr);
      gap: 24px;
      align-items: start;
    }
    @media (max-width: 1150px) {
      .settings-cards-grid { grid-template-columns: 1fr; }
    }
    .settings-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 24px 26px;
    }
    .settings-card h3 {
      font-size: 16px;
      font-weight: 700;
      margin: 0 0 4px;
    }
    .settings-card .card-sub {
      font-size: 12.5px;
      color: var(--text-light);
      margin: 0 0 22px;
    }

    .form-group-custom { margin-bottom: 18px; }
    .form-group-custom:last-child { margin-bottom: 0; }
    .form-row-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    @media (max-width: 560px) {
      .form-row-2 { grid-template-columns: 1fr; }
    }

    #contact-fields { border: 0; margin: 0; padding: 0; min-width: 0; }
    #contact-fields legend { margin-bottom: 1rem; font-size: 1.125rem; font-weight: 700; }
    .settings-nav a { display: block; }
    [hidden] { display: none !important; }
  </style>
  <link rel="stylesheet" href="../css/interactions.css">
  <script src="../js/dialogs.js"></script>
  <link rel="stylesheet" href="../css/theme.css">
  <script src="../js/theme.js"></script>
  <link rel="icon" type="image/svg+xml" href="../assets/logo.svg">
</head>
<body>

  <div class="dashboard-layout">
    
    <aside class="sidebar">
      <div class="sidebar-header">
        <img class="site-wordmark" src="../assets/logo.svg" alt="RepairDesk" width="156" height="26">
      </div>

      <nav class="sidebar-nav">
        <div class="nav-section">Operations</div>
        <ul>
          <li class="nav-item"><a href="index.html" class="nav-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg><span>Dashboard</span></a></li>
          <li class="nav-item"><a href="jobs.html" class="nav-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg><span>Jobs & Repairs</span></a></li>
          <li class="nav-item"><a href="technicians.html" class="nav-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg><span>Technicians</span></a></li>
          <li class="nav-item"><a href="customers.html" class="nav-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg><span>Customers</span></a></li>
        </ul>
        <div class="nav-section">Insights & Admin</div>
        <ul>

          <li class="nav-item"><a href="settings.html" class="nav-link active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg><span>Shop Settings</span></a></li>
        </ul>
      </nav>

      <div class="sidebar-footer">
        <div class="sidebar-user">
          <div class="avatar" id="sidebar-avatar"></div>
          <div class="user-info">
            <div class="user-name" id="sidebar-user-name"></div>
            <div class="user-role">
              <span id="staff-role"></span>
            </div>
          </div>
        </div>
        <button type="button" class="staff-signout" id="staff-signout" aria-label="Sign out" title="Sign out"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M10 4H5v16h5 M9 12h12m-5-5 5 5-5 5"/></svg></button>
      </div>
    </aside>

    <main class="main-content">
      
      <header class="topbar">
        <div class="topbar-left">
          <button class="hamburger" id="sidebar-toggle-btn" aria-label="Toggle menu">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
          </button>
          <h1>Shop Settings</h1>
        </div>
      </header>

      <div class="page-content">
        
        <div class="settings-grid">

          <aside aria-label="Settings navigation">
            <ul class="settings-nav">
              <li><button type="button" class="settings-nav-btn active" data-panel="general" aria-controls="panel-general" aria-pressed="true">Shop contact details</button></li>
              <li><button type="button" class="settings-nav-btn" data-panel="roles" aria-controls="panel-roles" aria-pressed="false">Open Roles</button></li>
              <li><a class="settings-nav-btn" href="../pages/pricing.html#storage">View storage policy</a></li>
            </ul>
          </aside>

          <section>

            <form id="panel-general" class="settings-card">
              <fieldset id="contact-fields" disabled>
                <legend>Shop contact details</legend>
                <div class="form-group-custom">
                  <label class="form-label" for="shop-name">Shop name</label>
                  <input id="shop-name" name="shop-name" class="form-input" maxlength="1000">
                </div>
                <div class="form-group-custom form-row-2">
                  <div>
                    <label class="form-label" for="shop-email">Shop email</label>
                    <input id="shop-email" name="shop-email" class="form-input" type="email" maxlength="1000" aria-describedby="email-help">
                    <p class="row-sub" id="email-help">Receives support inquiries and job applications.</p>
                  </div>
                  <div>
                    <label class="form-label" for="shop-phone">Counter phone</label>
                    <input id="shop-phone" name="shop-phone" class="form-input" type="tel" maxlength="1000">
                  </div>
                </div>
                <div class="form-group-custom">
                  <label class="form-label" for="shop-address">Counter address</label>
                  <input id="shop-address" name="shop-address" class="form-input" maxlength="1000">
                </div>
                <div class="settings-actions">
                  <button type="reset" class="btn btn-outline">Discard changes</button>
                  <button type="submit" class="btn btn-primary">Save contact details</button>
                </div>
              </fieldset>
            </form>

            <div class="settings-cards-grid" id="panel-roles" hidden>
              <section class="settings-card">
                <h3>Post a role</h3>
                <form id="position-form">
                  <div class="form-group-custom">
                    <label class="form-label" for="position-title">Position title</label>
                    <input id="position-title" name="title" class="form-input" required maxlength="120">
                  </div>
                  <div class="form-group-custom">
                    <label class="form-label" for="position-description">Description</label>
                    <textarea id="position-description" name="description" class="form-input" rows="5" required maxlength="4000"></textarea>
                  </div>
                  <button class="btn btn-primary" type="submit">Publish role</button>
                </form>
              </section>
              <section class="settings-card">
                <h3>Published roles</h3>
                <p class="card-sub"><a href="../pages/roles.html">View public listings</a></p>
                <div id="positions" aria-live="polite"></div>
              </section>
            </div>

          </section>

        </div>

      </div>
    </main>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/dashboard.js"></script>
  <script>
    const contactForm = document.getElementById('panel-general');
    const contactFields = document.getElementById('contact-fields');
    const rolesPanel = document.getElementById('panel-roles');
    const sectionButtons = document.querySelectorAll('[data-panel]');

    for (const button of sectionButtons) {
      button.onclick = () => {
        const showRoles = button.dataset.panel === 'roles';
        contactForm.hidden = showRoles;
        rolesPanel.hidden = !showRoles;
        for (const tab of sectionButtons) {
          tab.classList.toggle('active', tab === button);
          tab.setAttribute('aria-pressed', String(tab === button));
        }
      };
    }

    document.addEventListener('repairdesk:ready', () => {
      for (const {field, value} of snapshot.settings) {
        const input = contactForm.elements.namedItem(field);
        if (input) input.defaultValue = value;
      }
      contactFields.disabled = false;
    });

    contactForm.addEventListener('submit', async event => {
      event.preventDefault();
      if (contactFields.disabled) return;
      const values = Object.fromEntries(new FormData(contactForm));
      contactFields.disabled = true;
      try {
        await RD.call('settings', values);
        for (const [field, value] of Object.entries(values)) {
          contactForm.elements.namedItem(field).defaultValue = value;
        }
        RDUI.notice('Shop contact details saved.');
      } finally {
        contactFields.disabled = false;
      }
    });
  </script>
<script src="../js/positions.js"></script>
</body>
</html>
